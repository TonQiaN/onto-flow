# 付费冒烟：真实调用 DeepSeek，需要仓库 secret DEEPSEEK_API_KEY。
# 不是合并门槛——按需 workflow_dispatch，外加每天 UTC 20:00 一次。
#
# 跑在 macOS：bash 沙箱的内核围栏在 macOS 上是实测过的 Seatbelt（sandbox-exec），
# 冒烟验的是「真实运行能起、能写产物、能收束」，围栏行为要和本机一致。
# 凭据只以环境变量进入 Next/脚本进程，spawn 时按引用名注入子进程，
# 不落组合文件、不落日志、不落运行目录（AGENTS.md「Commands」）。
name: Paid smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"

concurrency:
  group: paid-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke-harness · smoke-engine
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 凭据必须存在，否则直接失败而不是跑到一半才报 MISSING_CREDENTIAL
        if: env.DEEPSEEK_API_KEY == ''
        run: |
          echo "::error::仓库 secret DEEPSEEK_API_KEY 未配置，付费冒烟无法运行"
          exit 1
      - run: npm ci
      - run: npm run db:push
      - run: npm run db:seed
      - name: 子进程冒烟（boot、一轮对话、产物、结构化输出、收束）
        run: npx tsx scripts/smoke-harness.ts
      - name: 引擎冒烟（两 Action 节点的线性工作流经 startRun 跑通）
        run: npx tsx scripts/smoke-engine.ts
      - name: 上传运行目录的 harness 日志（凭据按契约不会出现在里面）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-logs
          path: data/runs/**/logs/
          if-no-files-found: ignore
          retention-days: 7
